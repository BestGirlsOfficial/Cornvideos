{% extends "base.html" %}{% block body %}<div class="card"><h2>Videó beküldése az adminnak</h2>
<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf}}">
<label>Cím<input name="title" maxlength="120" required></label><label>Leírás<textarea name="descr" maxlength="2000"></textarea></label>
<label>Videó (MP4 vagy WebM, max. 500 MB)<input type="file" name="file" accept="video/mp4,video/webm" required></label>
<p><label><input type="checkbox" name="age_ok" required>Minden szereplő elmúlt 18 éves a felvételkor, és ezt igazolni tudom.</label></p>
<p><label><input type="checkbox" name="consent_ok" required>Minden szereplő hozzájárult a felvételhez és a közzétételhez.</label></p>
<button>Beküldés</button></form></div>{% endblock %}
