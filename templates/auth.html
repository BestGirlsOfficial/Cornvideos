{% extends "base.html" %}{% block body %}<div class="card"><h2>{{ 'Regisztráció' if register else 'Belépés' }}</h2>
<p>Ez az oldal felnőtt tartalmat tartalmaz. Csak 18 éven felüliek léphetnek be.</p>
<form method="post"><input type="hidden" name="csrf" value="{{csrf}}">
<label>Felhasználónév<input name="name" required></label><label>Jelszó<input type="password" name="pw" required></label>
{% if register %}<label>Születési dátum<input type="date" name="birth" required></label>
<p><label><input type="checkbox" name="terms" required>Elmúltam 18 éves, és elfogadom a <a href="/szabalyzat">szabályzatot</a>.</label></p>{% endif %}
<button>Tovább</button></form></div>{% endblock %}
